<section
  class="elp-form-section"
  id="formSection"
>

  <div class="elp-form-card">


    <div class="elp-form-copy">

      <div class="elp-section-kicker">
        ВАШ ЗАПРОС
      </div>

      <h2>
        Что вам показать?
      </h2>

      <p>
        Выберите то, что важно.
        Можно несколько вариантов.
      </p>

    </div>


    <form
      id="leadForm"
      novalidate
    >

      <div
        class="elp-chips"
        id="interestChips"
      >

        <label class="elp-chip">

          <input
            type="checkbox"
            name="interests"
            value="Квартиры и планировки"
          >

          <span>
            Квартиры и планировки
          </span>

        </label>


        <label class="elp-chip">

          <input
            type="checkbox"
            name="interests"
            value="Цены"
          >

          <span>
            Цены
          </span>

        </label>


        <label class="elp-chip">

          <input
            type="checkbox"
            name="interests"
            value="Рассрочка / ипотека"
          >

          <span>
            Рассрочка / ипотека
          </span>

        </label>


        <label class="elp-chip">

          <input
            type="checkbox"
            name="interests"
            value="Вид из квартиры"
          >

          <span>
            Вид из квартиры
          </span>

        </label>


        <label class="elp-chip">

          <input
            type="checkbox"
            name="interests"
            value="Хочу сравнить варианты"
          >

          <span>
            Хочу сравнить варианты
          </span>

        </label>


        <label class="elp-chip">

          <input
            type="checkbox"
            name="interests"
            value="Пока просто смотрю"
          >

          <span>
            Пока просто смотрю
          </span>

        </label>

      </div>


      <div class="elp-contact-title">
        Куда отправить подборку?
      </div>


      <div class="elp-fields">


        <label>

          <span>
            Имя
          </span>

          <input
            type="text"
            name="first_name"
            required
            autocomplete="given-name"
            placeholder="Имя"
          >

        </label>


        <label>

          <span>
            Фамилия
          </span>

          <input
            type="text"
            name="last_name"
            required
            autocomplete="family-name"
            placeholder="Фамилия"
          >

        </label>


        <label>

          <span>
            Телефон
          </span>

          <input
            type="tel"
            name="phone"
            required
            autocomplete="tel"
            inputmode="tel"
            placeholder="+7"
          >

        </label>


        <label>

          <span>
            Отчество
          </span>

          <input
            type="text"
            name="patronymic"
            autocomplete="additional-name"
            placeholder="Отчество"
          >

        </label>

      </div>


      <label class="elp-consent">

        <input
          type="checkbox"
          name="consent"
          required
        >

        <span>

          Соглашаюсь на обработку персональных данных
          и принимаю

          <a
            id="privacyLink"
            href="https://elitopolis.ru/"
            target="_blank"
            rel="noopener"
          >
            политику конфиденциальности
          </a>.

        </span>

      </label>


      <button
        type="submit"
        class="elp-primary elp-submit"
      >

        Получить варианты

        <span>→</span>

      </button>


      <div
        class="elp-form-status"
        id="formStatus"
        aria-live="polite"
      ></div>

    </form>


    <!-- ПОЯВЛЯЕТСЯ ПОСЛЕ УСПЕШНОЙ ОТПРАВКИ -->

    <div
      class="elp-success"
      id="successBlock"
      hidden
    >

      <div class="elp-success__mark">
        ✓
      </div>

      <h2>
        Спасибо!
      </h2>

      <p>
        Мы уже приступили к подбору актуальных вариантов.<br>
        Скоро свяжемся с вами.
      </p>

      <div class="elp-note">
        АН «Элитополис»
      </div>

    </div>


  </div>

</section>
